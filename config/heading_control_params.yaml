# ==============================================================================
# BNO055 Heading Controller Parameters Configuration
# ==============================================================================

bno055_heading_control_node:
  ros__parameters:
    # --------------------------------------------------------------------------
    # 1. Topic Configuration & Passthrough Pipeline
    # --------------------------------------------------------------------------
    imu_topic: "/imu/data"                         # Input IMU topic (sensor_msgs/msg/Imu)
    cmd_vel_in_topic: "/drive/cmd_vel"             # Raw input velocity command
    cmd_vel_out_topic: "/mecanum/cmd_vel_heading"  # Corrected output velocity command

    # --------------------------------------------------------------------------
    # 2. Feedforward (FF) Control & Drift Cancellation
    # --------------------------------------------------------------------------
    enable_feedforward: true           # Enable multi-term feedforward
    k_ff_vel: 1.0                      # Angular velocity command feedforward gain (w_cmd)
    k_ff_acc: 0.0                      # Angular acceleration feedforward gain (dw_cmd/dt)
    k_ff_drift_vx: 0.0                 # Translational Vx drift compensation gain
    k_ff_drift_vy: 0.0                 # Translational Vy drift compensation gain
    k_ff_drift_ax: 0.0                 # Translational Ax acceleration drift compensation gain
    k_ff_drift_ay: 0.0                 # Translational Ay acceleration drift compensation gain
    accel_filter_alpha: 0.3            # Low-pass filter alpha for acceleration estimation (0.0 - 1.0)

    # --------------------------------------------------------------------------
    # 3. Control Gains (Proven PID Architecture matching heading_hold_node)
    # --------------------------------------------------------------------------
    kp: 4.0                            # Proportional Gain (Restoring force)
    ki: 0.0                            # Integral Gain (Set to 0.0 to eliminate overshoot drift)
    kd: 0.05                           # Derivative Gain (Direct Gyro-Z braking)
    kff: 1.0                           # Feedforward Gain (alias for k_ff_vel)
    max_i_term: 0.5                    # Anti-windup integral saturation limit (+-0.5)
    max_output: 1.5                    # Maximum angular velocity correction limit (rad/s)
    deadband_deg: 0.5                  # Deadband (0.5 degrees) to completely eliminate jitter/creeping
    cutoff_freq_hz: 20.0               # 1st-Order Low-Pass Filter cutoff frequency (Hz)
    max_slew_rate: 0.0                 # Max change rate of output (rad/s^2)
    angular_deadband: 0.08             # Turning threshold (rad/s) to disengage heading lock
    turn_relock_delay: 0.20            # Delay (seconds) after manual turn before re-locking heading to prevent snap-back

    # --------------------------------------------------------------------------
    # 4. IMU Coordinate Alignment & Adaptive Scaling
    # --------------------------------------------------------------------------
    yaw_axis: "z"                      # Axis corresponding to physical Yaw rotation ("z", "x", or "y")
    max_translation_speed: 1.0         # Max expected speed (m/s) to scale down correction at low speeds

    # --------------------------------------------------------------------------
    # 5. Safety Watchdog & Fail-Safe Protection
    # --------------------------------------------------------------------------
    cmd_vel_timeout: 0.5               # Command loss timeout (s). Triggers Zero Velocity stop
    imu_timeout: 0.25                  # IMU loss timeout (s, 250ms). Prevents false-positive failsafe from CAN jitter
    enable_diagnostics: true           # Publish 1Hz real-time diagnostic status (/diagnostics)

